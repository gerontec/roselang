[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roselang-mathlib"
version = "0.1.0"
description = "Theorem statements of Lean mathlib4 (machine-checked, level proven) as a knowledge pack for Rose (roselang)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
dependencies = ["roselang>=0.1.0"]

[project.urls]
Homepage = "https://github.com/gerontec/roselang"
Source-of-data = "https://github.com/leanprover-community/mathlib4"

[tool.setuptools]
packages = ["rose_mathlib"]

[tool.setuptools.package-data]
rose_mathlib = ["catalog.jsonl"]
