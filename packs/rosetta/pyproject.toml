[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roselang-rosetta"
version = "0.1.0"
description = "Rosetta Code tasks and Python solutions as a knowledge pack for Rose (roselang)"
readme = "README.md"
requires-python = ">=3.10"
license = "GFDL-1.3-or-later"
license-files = ["LICENSE.md"]
dependencies = ["roselang>=0.1.0"]

[project.urls]
Homepage = "https://github.com/gerontec/roselang"
Source-of-data = "https://rosettacode.org"

[tool.setuptools]
packages = ["rose_rosetta"]

[tool.setuptools.package-data]
rose_rosetta = ["catalog.jsonl", "impl.jsonl"]
