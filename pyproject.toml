[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "roselang"
version = "0.1.2"
description = "Rose: an LLM-optimised composition language with built-in knowledge of solved problems (laws, constants, open problems, bio ontology), unit-checked, compiling to Python; also usable as the Python module `rose`"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "rose/std/LICENSES.md"]
authors = [{ name = "Gerontec" }]
keywords = ["llm", "compiler", "units", "physics", "dsl", "knowledge base", "decision tables"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
semantic = ["numpy>=1.24", "requests>=2.28"]   # vector search with std/catalog.vec + an embedding endpoint
db = ["pymysql>=1.0", "requests>=2.28"]        # the corpus database (maintainers)

[project.scripts]
rosec = "rose.cli:main"

[project.urls]
Homepage = "https://github.com/gerontec/roselang"
Concept = "https://github.com/gerontec/roselang/blob/main/docs/CONCEPT.md"

[tool.setuptools]
packages = ["rose"]
include-package-data = false

[tool.setuptools.package-data]
rose = ["std/*.rose", "std/const/*.rose", "std/index.json", "std/problems.json", "std/catalog.jsonl.gz", "std/LICENSES.md", "std/sets/*.jsonl.gz", "std/knowledge.sqlite.gz", "std/knowledge.key"]
